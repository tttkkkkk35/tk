<!DOCTYPE html><html lang=zh data-t=sepia><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>我的小小说</title><style>
:root{--fs:18px}
[data-t=light]{--bg:#fff;--tx:#222;--sf:#f4f5f7;--bd:#e6e8eb;--ac:#3b7ddd;--dm:#999}
[data-t=sepia]{--bg:#f7f1e3;--tx:#4a4034;--sf:#efe7d5;--bd:#e2d8c3;--ac:#b07d3f;--dm:#9a8f7d}
[data-t=green]{--bg:#cce8cf;--tx:#2b3a2e;--sf:#bfdfc3;--bd:#b0d3b5;--ac:#3f8f5a;--dm:#6b7d6e}
[data-t=dark]{--bg:#16181c;--tx:#c9ccd1;--sf:#1e2126;--bd:#2a2e35;--ac:#6ea8fe;--dm:#6d7279}
*{box-sizing:border-box;margin:0}
body{height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font-family:"Songti SC",SimSun,serif;overflow:hidden}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
#head{display:flex;gap:6px;align-items:center;padding:6px;border-bottom:1px solid var(--bd)}
#head button{width:36px;height:36px;font-size:15px}
#title{flex:1;text-align:center;font-size:14px;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#reader{flex:1;overflow-y:auto;padding:0 18px}
#page{max-width:720px;margin:0 auto;padding:20px 0 60px;font-size:var(--fs);line-height:2}
#page p{margin:0 0 .9em;text-indent:2em;text-align:justify}
#page h2{text-align:center;font-size:1.25em;text-indent:0;margin:.4em 0 1.5em;font-weight:600}
#foot{display:flex;gap:8px;align-items:center;padding:6px 10px;border-top:1px solid var(--bd)}
#foot button{padding:8px 12px;border:1px solid var(--bd);background:var(--sf);font-size:13px;border-radius:6px}
#foot button:disabled{opacity:.3}
#pinfo{text-align:center;font-size:11px;color:var(--dm)}
#slider{width:100%;accent-color:var(--ac)}
#mask{position:fixed;inset:0;background:rgba(0,0,0,.3);opacity:0;pointer-events:none;z-index:9;transition:.3s}
#mask.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;height:100%;width:340px;max-width:90vw;background:var(--bg);border-left:1px solid var(--bd);transform:translateX(101%);transition:.3s;z-index:10;display:flex;flex-direction:column}
#drawer.on{transform:none}
#dhead{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid var(--bd);font-weight:600}
#dhead button{font-size:16px}
#dbody{flex:1;overflow-y:auto;padding:8px 12px 20px}
.tabs{display:flex;gap:4px;padding:6px 12px 0}
.tabs button{padding:7px 12px;font-size:13px;color:var(--dm);border-radius:6px}
.tabs button.on{background:var(--sf);color:var(--tx);font-weight:600}
.set{padding:12px 0;border-bottom:1px solid var(--bd)}
.set:last-child{border:none}
.lab{font-size:12px;color:var(--dm);margin-bottom:8px;display:flex;justify-content:space-between}
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.themes button{aspect-ratio:1;border:2px solid transparent;font-size:10px;padding-bottom:4px;display:flex;align-items:flex-end;justify-content:center;border-radius:8px}
.themes button.on{border-color:var(--ac)}
.tb[data-t=light]{background:#fff;color:#333;border-color:#e6e8eb}
.tb[data-t=sepia]{background:#f7f1e3;color:#4a4034;border-color:#e2d8c3}
.tb[data-t=green]{background:#cce8cf;color:#2b3a2e;border-color:#b0d3b5}
.tb[data-t=dark]{background:#1b1e23;color:#c9ccd1;border-color:#2a2e35}
.row{display:flex;align-items:center;gap:6px;background:var(--sf);padding:3px;border-radius:8px}
.row button{flex:0 0 40px;height:32px;background:var(--bg);border-radius:6px}
.row span{flex:1;text-align:center;font-size:13px;font-weight:600}
.o{padding:10px;border-radius:8px;font-size:14px}
.o:hover{background:var(--sf)}
.o.on{color:var(--ac);font-weight:600}
.e{padding:10px;border-bottom:1px solid var(--bd);cursor:pointer}
.e:hover{background:var(--sf)}
.e b{font-size:13px;font-weight:400;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.e small{color:var(--dm);font-size:11px}
.z{text-align:center;color:var(--dm);font-size:13px;padding:30px 20px;line-height:1.8}
.k{width:100%;padding:10px;border:1px solid var(--bd);background:var(--sf);font-size:13px;margin-top:8px;text-align:left;border-radius:8px;font-family:inherit}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100;opacity:0;pointer-events:none;transition:.25s}
#modal.on{opacity:1;pointer-events:auto}
#mbox{width:100%;max-width:560px;background:var(--bg);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;max-height:88vh}
#mhead{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--bd);font-weight:600}
#mhead button{font-size:16px}
#mtip{padding:8px 12px;font-size:11px;color:var(--dm);background:var(--sf)}
#mtip code{background:var(--bg);padding:1px 4px;color:var(--ac);border-radius:3px}
#mtext{flex:1;min-height:260px;border:none;outline:none;padding:12px;font-family:monospace;font-size:13px;line-height:1.7;background:var(--bg);color:var(--tx);resize:none}
#mfoot{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--bd)}
#mfoot button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--sf);font-size:13px;border-radius:8px}
#mfoot .pm{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,10px);background:rgba(0,0,0,.8);color:#fff;padding:9px 18px;border-radius:18px;font-size:13px;opacity:0;transition:.3s;z-index:200;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:520px){#drawer{width:100%}}
</style>
</head>
<body>
<header id="head">
<button id="bt1">☰</button>
<div id="title">加载中…</div>
<button id="bt2">⤴</button>
<button id="bt3">⚙</button>
</header>
<main id="reader"><article id="page"></article></main>
<footer id="foot">
<button id="bp">上一页</button>
<div style="flex:1"><input type="range" id="slider" min="0" max="0" value="0"><div id="pinfo">1/1</div></div>
<button id="bn">下一页</button>
</footer>
<div id="mask"></div>
<aside id="drawer">
<div id="dhead"><span id="dtitle">目录</span><button id="dc">✕</button></div>
<div class="tabs" id="tabs">
<button class="on" data-tab="toc">目录</button>
<button data-tab="bm">书签</button>
<button data-tab="set">设置</button>
</div>
<div id="dbody">
<div data-panel="toc"><div id="tocList"></div></div>
<div data-panel="bm" hidden><button class="k" id="addBm">＋ 收藏当前页</button><div id="bmList" style="margin-top:10px"></div></div>
<div data-panel="set" hidden>
<div class="set"><div class="lab">主题</div><div class="themes" id="themes"></div></div>
<div class="set"><div class="lab">字号 <b id="fsv">18px</b></div><div class="row"><button data-fs="-1">A−</button><span id="fss">18</span><button data-fs="1">A＋</button></div></div>
<div class="set"><div class="lab">行距 <b id="lhv">2.0</b></div><div class="row"><button data-lh="-1">−</button><span id="lhs">2.0</span><button data-lh="1">＋</button></div></div>
<div class="set"><div class="lab">字体</div><div class="row" id="fonts"><button data-f="serif">宋</button><button data-f="sans">黑</button><button data-f="kai">楷</button></div></div>
<div class="set"><div class="lab">书名 / 昵称</div><input class="k" id="ipt" placeholder="书名"><input class="k" id="ipa" placeholder="昵称"></div>
<div class="set"><div class="lab">内容</div><button class="k" id="editBtn">✎ 编辑 / 导入我的小说</button><button class="k" id="resetBtn">↺ 恢复示例</button></div>
</div>
</div>
</aside>
<div id="modal"><div id="mbox">
<div id="mhead"><span>编辑正文</span><button id="mc">✕</button></div>
<div id="mtip"><code># 书名</code> <code>@昵称</code> <code>## 章节</code> 空行分段</div>
<textarea id="mtext" spellcheck="false"></textarea>
<div id="mfoot"><button id="mx">取消</button><button id="ms" class="pm">保存</button></div>
</div></div>
<script>
const $=s=>document.querySelector(s),LS='wg_';
const DEF=`# 星海拾遗
@夜航船

## 第一章 第七封信

老邮差把第七封信塞进我手里的时候，海面上正浮着一层薄薄的雾。

信封是用旧海图折的，边角磨得起毛，邮戳上印着一个我不认识的日期——三十年后。

"从灯塔那边漂来的。"他压了压帽檐，"这星期，第七封了。"

我把信翻过来。背面用铅笔写着一行小字：寄件人，林昭。那是我自己的名字。

拆开信封，里面只有一张纸条，是我熟悉的、自己的笔迹："别关掉那盏灯。"

窗外，灯塔的光柱正好扫过海面，像一只缓慢眨动的眼睛。

## 第二章 灯与潮汐

我在这座灯塔上住了三年。从父亲手里接过它的时候，我以为自己会恨它。

可父亲说，这盏灯不是为了照亮海，是为了照亮回来的路。

"谁回来的路？"他没回答。第二年春天，他出海，没有再回来。

## 第三章 三十年后的回音

信一共七封。第七封信上写着："明天晚上十一点零七分，把灯熄灭十三秒。十三秒之后，你会看见我。"

我伸手，拉下了总闸。数到十三的时候，海面上亮起了一点很小的光。

那是一艘船，正在朝灯塔驶来。

## 第四章 归航

船靠岸的时候，天快亮了。从船上走下来的人，穿着我父亲的旧外套。

"信是你写的。"我说。

"是。"他说，"从三十年后的灯塔上。"

"那你怎么回来的？"

"顺着光回来的。"他笑了一下，"灯亮着，我就知道家在哪里。"

灯塔的光柱缓缓转过最后半圈，然后熄灭了。`;
const FONT={serif:'"Songti SC",SimSun,serif',sans:'"PingFang SC","Microsoft YaHei",sans-serif',kai:'"Kaiti SC",KaiTi,serif'};
const THEMES={light:'日间',sepia:'纸张',green:'护眼',dark:'夜间'};
let S={theme:'sepia',fs:18,lh:2,font:'serif'},novel={title:'',author:'',chs:[]},pages=[],page=0,bms=[],shared=false;
function saveS(){try{localStorage.setItem(LS+'s',JSON.stringify({S,bms}))}catch(e){}}
function loadS(){try{const o=JSON.parse(localStorage.getItem(LS+'s'));if(o){if(o.S)Object.assign(S,o.S);if(o.bms)bms=o.bms}}catch(e){}}
function parse(t){let title='未命名',author='佚名',chs=[],cur=null;t.split('\n').forEach(r=>{const l=r.trim();if(!l)return;if(l.startsWith('## ')){cur={t:l.slice(3)||'无题',ps:[]};chs.push(cur);return}if(l.startsWith('# ')){title=l.slice(2)||title;return}if(l.startsWith('@')){author=l.slice(1)||author;return}if(!cur){cur={t:'正文',ps:[]};chs.push(cur)}cur.ps.push(l)});if(!chs.length)chs.push({t:'正文',ps:['（暂无内容）']});chs.forEach(c=>{if(!c.ps.length)c.ps.push('（本章暂无内容）')});return{title,author,chs}}
function ser(n){let s='# '+n.title+'\n@'+n.author+'\n\n';n.chs.forEach(c=>{s+='## '+c.t+'\n\n';c.ps.forEach(p=>s+=p+'\n\n')});return s.trim()}
function lim(){return Math.max(260,Math.round(1200-S.fs*30))}
function cut(t,lm){if(t.length<=lm)return[t];const ps=t.match(/[^。！？!?…；;]+[。！？!?…；;]*/g)||[t];const o=[];let b='';for(const p of ps){if(b&&(b+p).length>lm){o.push(b);b=p}else b+=p}if(b)o.push(b);return o}
function pag(n){const lm=lim(),pg=[];n.chs.forEach((c,ci)=>{let cur=null;const op=st=>{cur={ci,st,b:[],n:0}};op(true);c.ps.forEach(raw=>{cut(raw,lm).forEach(s=>{if(cur.n>0&&cur.n+s.length>lm){pg.push(cur);op(false)}cur.b.push(s);cur.n+=s.length})});if(cur.b.length)pg.push(cur)});return pg.length?pg:[{ci:0,st:true,b:['（暂无内容）'],n:0}]}
function render(){const p=pages[page];if(!p)return;const el=$('#page');el.innerHTML='';if(p.st){const h=document.createElement('h2');h.textContent=novel.chs[p.ci].t;el.appendChild(h)}p.b.forEach(t=>{const q=document.createElement('p');q.textContent=t;el.appendChild(q)});$('#reader').scrollTop=0;$('#pinfo').textContent=(page+1)+'/'+pages.length;$('#slider').max=Math.max(0,pages.length-1);$('#slider').value=page;$('#bp').disabled=page===0;$('#bn').disabled=page===pages.length-1;document.querySelectorAll('.o').forEach(x=>x.classList.toggle('on',+x.dataset.i===p.ci));saveP()}
function go(i){if(i<0||i>=pages.length||i===page)return;page=i;render()}
function next(){if(page<pages.length-1)go(page+1)}
function prev(){if(page>0)go(page-1)}
function saveP(){if(shared)return;try{localStorage.setItem(LS+'p',String(page/Math.max(1,pages.length-1)))}catch(e){}}
function apply(){document.documentElement.dataset.t=S.theme;document.documentElement.style.setProperty('--fs',S.fs+'px');document.body.style.fontFamily=FONT[S.font]||FONT.serif;document.querySelectorAll('.tb').forEach(b=>b.classList.toggle('on',b.dataset.t===S.theme));document.querySelectorAll('#fonts button').forEach(b=>b.classList.toggle('on',b.dataset.f===S.font));$('#fss').textContent=S.fs;$('#fsv').textContent=S.fs+'px';$('#lhs').textContent=S.lh.toFixed(1);$('#lhv').textContent=S.lh.toFixed(1);$('#ipt').value=novel.title;$('#ipa').value=novel.author;$('#title').textContent=novel.title;document.title=novel.title}
function toc(){const cl=$('#tocList');cl.innerHTML='';const cur=pages[page]?pages[page].ci:0;novel.chs.forEach((c,i)=>{const el=document.createElement('div');el.className='o'+(i===cur?' on':'');el.dataset.i=i;el.textContent=(i+1)+'. '+c.t;el.onclick=()=>{const idx=pages.findIndex(p=>p.ci===i&&p.st);go(idx>=0?idx:0);closeD()};cl.appendChild(el)})}
function bmList(){const bl=$('#bmList');bl.innerHTML='';if(!bms.length){bl.innerHTML='<div class="z">还没有书签</div>';return}bms.slice().sort((a,b)=>a.p-b.p).forEach(b=>{const el=document.createElement('div');el.className='e';el.innerHTML='<b></b><small>'+b.c+'</small>';el.querySelector('b').textContent=b.t||'（无预览）';el.onclick=()=>{go(Math.round(b.p*Math.max(1,pages.length-1)));closeD()};el.ondblclick=ev=>{ev.stopPropagation();bms.splice(bms.indexOf(b),1);saveS();bmList();msg('已删除')};bl.appendChild(el)})}
function addBm(){const p=pages[page];if(!p)return;const pr=page/Math.max(1,pages.length-1);if(bms.some(b=>Math.abs(b.p-pr)<0.004)){msg('已经收藏过啦');return}const d=new Date();bms.push({p:pr,c:novel.chs[p.ci].t,t:p.b[0]||'',time:(d.getMonth()+1)+'/'+d.getDate()});saveS();bmList();msg('已加入书签 ★')}
function openD(tab){$('#drawer').classList.add('on');$('#mask').classList.add('on');document.querySelectorAll('#tabs button').forEach(t=>t.classList.toggle('on',t.dataset.tab===tab));document.querySelectorAll('[data-panel]').forEach(p=>p.hidden=p.dataset.panel!==tab);$('#dtitle').textContent=tab==='toc'?'目录':tab==='bm'?'书签':'设置';$('#dbody').scrollTop=0}
function closeD(){$('#drawer').classList.remove('on');$('#mask').classList.remove('on')}
async function share(){const url=location.href.split('#')[0]+'#s='+btoa(unescape(encodeURIComponent(ser(novel))))+'&p='+(page+1);let ok=false;try{await navigator.clipboard.writeText(url);ok=true}catch(e){try{const ta=document.createElement('textarea');ta.value=url;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();ok=true}catch(e2){}}if(ok)msg('链接已复制 ✓');else prompt('复制链接：',url)}
function edit(){$('#mtext').value=ser(novel);$('#modal').classList.add('on');setTimeout(()=>$('#mtext').focus(),200)}
function saveEdit(){const t=$('#mtext').value.trim();if(!t){msg('内容不能为空');return}shared=false;novel=parse(t);pages=pag(novel);page=0;try{localStorage.setItem(LS+'c',t);localStorage.setItem(LS+'p','0')}catch(e){}apply();render();toc();$('#modal').classList.remove('on');closeD();msg('已保存，共'+pages.length+'页')}
function msg(t){const el=document.createElement('div');el.id='toast';el.textContent=t;document.body.appendChild(el);requestAnimationFrame(()=>el.classList.add('on'));setTimeout(()=>{el.classList.remove('on');setTimeout(()=>el.remove(),300)},2000)}
function repag(){const pr=page/Math.max(1,pages.length-1);pages=pag(novel);page=Math.max(0,Math.min(pages.length-1,Math.round(pr*Math.max(1,pages.length-1))));render();bmList()}
function bind(){document.getElementById('reader').addEventListener('click', function(e) {
  var x = e.clientX - this.getBoundingClientRect().left;
  if (x < this.offsetWidth * 0.4) { prev(); }
  else if (x > this.offsetWidth * 0.6) { next(); }
});$('#bn').onclick=next;$('#bp').onclick=prev;$('#slider').oninput=()=>{const v=+$('#slider').value;if(v!==page)go(v)};$('#bt1').onclick=()=>openD('toc');$('#bt2').onclick=share;$('#bt3').onclick=()=>openD('set');$('#dc').onclick=closeD;$('#mask').onclick=closeD;document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>openD(b.dataset.tab));document.querySelectorAll('.tb').forEach(b=>b.onclick=()=>{S.theme=b.dataset.t;apply();saveS()});document.querySelectorAll('[data-fs]').forEach(b=>b.onclick=()=>{S.fs=Math.max(13,Math.min(30,S.fs+ +b.dataset.fs));apply();saveS();repag()});document.querySelectorAll('[data-lh]').forEach(b=>b.onclick=()=>{S.lh=Math.max(1.4,Math.min(3,+(S.lh+ +b.dataset.lh*0.1).toFixed(1)));apply();saveS()});document.querySelectorAll('#fonts button').forEach(b=>b.onclick=()=>{S.font=b.dataset.f;apply();saveS()});$('#ipt').oninput=e=>{novel.title=e.target.value||'未命名';apply();try{localStorage.setItem(LS+'c',ser(novel))}catch(x){}};$('#ipa').oninput=e=>{novel.author=e.target.value||'佚名';apply();try{localStorage.setItem(LS+'c',ser(novel))}catch(x){}};$('#addBm').onclick=addBm;$('#editBtn').onclick=edit;$('#resetBtn').onclick=()=>{if(!confirm('恢复示例内容？'))return;try{localStorage.removeItem(LS+'c');localStorage.removeItem(LS+'p')}catch(e){}shared=false;novel=parse(DEF);pages=pag(novel);page=0;apply();render();toc();closeD();msg('已恢复')};$('#mc').onclick=()=>$('#modal').classList.remove('on');$('#mx').onclick=()=>$('#modal').classList.remove('on');$('#ms').onclick=saveEdit;document.onkeydown=e=>{if($('#modal').classList.contains('on'))return;const tag=document.activeElement?.tagName;if(tag==='INPUT'||tag==='TEXTAREA')return;if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();next()}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev()}else if(e.key==='Escape'){closeD();$('#modal').classList.remove('on')}};let tx=0,ty=0,tt=0;$('#reader').ontouchstart=e=>{if(e.touches.length!==1)return;tx=e.touches[0].clientX;ty=e.touches[0].clientY;tt=Date.now()};$('#reader').ontouchend=e=>{if($('#drawer').classList.contains('on'))return;const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;if(Date.now()-tt<600&&Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.6){dx<0?next():prev()}}}
function init(){loadS();apply();Object.keys(THEMES).forEach(t=>{const b=document.createElement('button');b.className='tb';b.dataset.t=t;b.textContent=THEMES[t];$('#themes').appendChild(b)});let t=DEF;const h=location.hash.slice(1),m=h.match(/s=([^&]+)/);if(m){try{t=decodeURIComponent(escape(atob(m[1])));shared=true}catch(e){t=DEF}}else{const sv=localStorage.getItem(LS+'c');if(sv&&sv.trim())t=sv}novel=parse(t);pages=pag(novel);let st=0;const pm=h.match(/p=(\d+)/);if(pm)st=+pm[1]-1;else if(!shared){const sp=localStorage.getItem(LS+'p');if(sp!==null&&!isNaN(+sp))st=Math.round(+sp*(pages.length-1))}page=Math.max(0,Math.min(pages.length-1,st||0));apply();toc();bmList();render();bind();if(shared)setTimeout(()=>msg('朋友分享给你的作品 ✦'),500)}
init();
</script>
</body>
</html>
